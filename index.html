<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Монетка: да или нет</title>
<meta name="description" content="Подбрось монетку онлайн: орёл или решка, да или нет. Рубль, доллар или евро.">
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.__tgReady && window.__tgReady()"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one screen, coin centered, currency switch on top, flip button at the bottom */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #66727f;
  --accent: #2a7bd6;
  --accent-fg: #ffffff;
  --shadow: rgba(22, 32, 43, .18);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a22; --surface: #1c2631; --fg: #e9eef3; --muted: #8e9aa7;
    --accent: #5aa2ef; --accent-fg: #0d1620; --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a22; --surface: #1c2631; --fg: #e9eef3; --muted: #8e9aa7;
  --accent: #5aa2ef; --accent-fg: #0d1620; --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  display: flex; flex-direction: column; align-items: center;
  padding-inline: 16px; padding-block: 16px 20px;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.app { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; gap: 18px; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.modes button {
  font: 700 14px var(--display); color: var(--fg); background: transparent; border: 2px solid var(--surface);
  padding: 11px 6px; border-radius: 12px; cursor: pointer;
}
.modes button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.modes button:focus-visible, .question:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.question {
  width: 100%; font: 500 16px var(--body); color: var(--fg); background: var(--surface);
  border: 0; border-radius: 12px; padding: 13px 14px; user-select: text;
}
.question::placeholder { color: var(--muted); }
.currencies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); padding: 5px; border-radius: 14px; }
.currencies button {
  font: 600 15px var(--body); color: var(--muted); background: transparent; border: 0;
  padding: 10px 4px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.currencies button b { font: 700 18px var(--display); }
.currencies button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.currencies button:focus-visible, .flip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage { flex: 1; min-height: 300px; display: grid; place-items: center; perspective: 1000px; position: relative; }
.toss { width: min(64vw, 240px); aspect-ratio: 1; max-width: 100%; position: relative; }
.coin { position: absolute; inset: 0; transform-style: preserve-3d; cursor: pointer; }
.face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
.face.back { transform: rotateY(180deg); }
.shadow {
  position: absolute; left: 50%; bottom: 14px; width: min(46vw, 170px); height: 18px; transform: translateX(-50%);
  background: radial-gradient(closest-side, var(--shadow), transparent); border-radius: 50%;
}

.result { text-align: center; min-height: 64px; display: flex; flex-direction: column; gap: 4px; }
.result .big { font: 700 28px var(--display); letter-spacing: .02em; }
.result .small { font-size: 14px; color: var(--muted); }

.stats { display: flex; justify-content: center; gap: 22px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats strong { color: var(--fg); font-weight: 600; }
.history { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 26px; }
.history span {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font: 600 11px var(--display); background: var(--surface); color: var(--muted);
}
.history span.h { color: var(--fg); }

.flip {
  font: 700 17px var(--display); letter-spacing: .03em; color: var(--accent-fg); background: var(--accent);
  border: 0; border-radius: 14px; padding: 17px; cursor: pointer; width: 100%;
}
.ad { width: 100%; max-width: 420px; min-height: 0; display: flex; justify-content: center; }
.ad:empty { display: none; }
.ad-placeholder {
  width: 100%; height: 90px; border: 2px dashed var(--muted); border-radius: 12px; color: var(--muted);
  display: grid; place-items: center; font-size: 14px; opacity: .7;
}
.flip:disabled { opacity: .55; cursor: default; }
.flip:active:not(:disabled) { transform: scale(.98); }
@media (prefers-reduced-motion: reduce) { .flip:active:not(:disabled) { transform: none; } }
</style>
</head>
<body>
<main class="app">
  <input class="question" id="question" type="text" maxlength="120" placeholder="Напиши вопрос (можно пропустить)">
  <div class="modes" role="group" aria-label="Ответ монеты">
    <button id="mode-coin" data-mode="coin" aria-pressed="true">Орёл или решка</button>
    <button id="mode-yesno" data-mode="yesno" aria-pressed="false">Да или нет</button>
  </div>

  <div class="currencies" role="group" aria-label="Монета">
    <button id="cur-rub" data-cur="rub" aria-pressed="true"><b>₽</b>Рубль</button>
    <button id="cur-usd" data-cur="usd" aria-pressed="false"><b>$</b>Доллар</button>
    <button id="cur-szn" data-cur="szn" aria-pressed="false"><b>SzN</b>SzN Group</button>
  </div>

  <div class="stage">
    <div class="shadow" id="shadow"></div>
    <div class="toss" id="toss">
      <div class="coin" id="coin" aria-hidden="true">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
  </div>

  <div class="result" aria-live="polite">
    <div class="big" id="resultBig">Подбрось монету</div>
    <div class="small" id="resultSmall">Нажми кнопку или саму монету</div>
  </div>

  <div class="stats">
    <span><span id="lblH">Орёл</span>: <strong id="cntH">0</strong></span>
    <span><span id="lblT">Решка</span>: <strong id="cntT">0</strong></span>
  </div>
  <div class="history" id="history" aria-label="Последние броски"></div>

  <button class="flip" id="flip">Подбросить</button>
  <div class="ad" id="ad-bottom"></div>
</main>

<script>
(function () {
  // ===== РЕКЛАМА: вставь сюда свои номера блоков (см. README) =====
  var ADS = {
    yandexBlockId: '',      // баннер Рекламной сети Яндекса на сайте, вида 'R-A-1234567-1'
    adsgramBlockId: '',     // реклама Adsgram внутри Telegram, вида '1234'
    adsgramEveryFlips: 5    // показывать рекламу Adsgram после каждого N-го броска
  };
  var SHOW_AD_PLACEHOLDER = false;  // true = показать пустое место под рекламу (для проверки)

  function loadScript(src, onload) {
    var el = document.createElement('script');
    el.src = src; el.async = true; el.onload = onload;
    document.head.appendChild(el);
  }

  function setupBanner() {
    var slot = document.getElementById('ad-bottom');
    var inTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
    if (ADS.yandexBlockId && !inTelegram) {
      var id = 'yandex_rtb_' + ADS.yandexBlockId;
      slot.innerHTML = '<div id="' + id + '"></div>';
      window.yaContextCb = window.yaContextCb || [];
      window.yaContextCb.push(function () {
        Ya.Context.AdvManager.render({ blockId: ADS.yandexBlockId, renderTo: id });
      });
      loadScript('https://yandex.ru/ads/system/context.js');
    } else if (SHOW_AD_PLACEHOLDER) {
      slot.innerHTML = '<div class="ad-placeholder">Здесь будет реклама</div>';
    }
  }

  var adsgram = null;
  function setupAdsgram() {
    if (!ADS.adsgramBlockId) return;
    loadScript('https://sad.adsgram.ai/js/sad.min.js', function () {
      try { adsgram = window.Adsgram.init({ blockId: ADS.adsgramBlockId }); } catch (e) {}
    });
  }
  function maybeShowAdsgram(flips) {
    if (adsgram && ADS.adsgramEveryFlips && flips % ADS.adsgramEveryFlips === 0) {
      adsgram.show().catch(function () {});
    }
  }

  // Скрипт Telegram грузится без блокировки страницы: монетка работает, даже если он не загрузился
  var tg = null;
  function initTg() {
    tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    tg.ready();
    tg.expand();
    // Follow the Telegram theme of the chat
    var p = tg.themeParams || {};
    var r = document.documentElement.style;
    if (p.bg_color) r.setProperty('--bg', p.secondary_bg_color || p.bg_color);
    if (p.section_bg_color || p.bg_color) r.setProperty('--surface', p.section_bg_color || p.bg_color);
    if (p.text_color) r.setProperty('--fg', p.text_color);
    if (p.hint_color) r.setProperty('--muted', p.hint_color);
    if (p.button_color) r.setProperty('--accent', p.button_color);
    if (p.button_text_color) r.setProperty('--accent-fg', p.button_text_color);
    if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme);
    report();
    if (tg.initData) setupAdsgram();
  }

  // Сообщаем боту, кто пользуется приложением (бот видит это в /users)
  function report() {
    if (!tg || !tg.initData) return;
    try { fetch('seen', { method: 'POST', body: tg.initData }).catch(function () {}); } catch (e) {}
  }
  if (window.Telegram && window.Telegram.WebApp) initTg(); else window.__tgReady = initTg;
  // Даём скрипту Telegram время загрузиться, чтобы понять, сайт это или приложение
  setTimeout(setupBanner, 1200);

      body += '<text ' + txt + ' font-size="13" letter-spacing="2" text-anchor="middle"><textPath href="#' + id + 'top" startOffset="50%">' + c.headsTop + '</textPath></text>';
      body += emblem(c.emblem, ink);
      body += '<text ' + txt + ' font-size="10" letter-spacing="1.5" text-anchor="middle"><textPath href="#' + id + 'bot" startOffset="50%" side="right">' + c.headsBottom + '</textPath></text>';
    } else {
      body += '<text ' + txt + ' x="100" y="112" font-size="' + (c.value.length > 1 ? 50 : 64) + '" font-weight="700" text-anchor="middle">' + c.value + '</text>';
      body += '<text ' + txt + ' x="100" y="138" font-size="13" letter-spacing="2" text-anchor="middle">' + c.unit + '</text>';
      if (c.tailsBottom) body += '<text ' + txt + ' font-size="9" letter-spacing="1.5" text-anchor="middle"><textPath href="#' + id + 'top" startOffset="50%">' + c.tailsBottom + '</textPath></text>';
    }
    return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' + defs + body + '</svg>';
  }

  var $ = function (id) { return document.getElementById(id); };
  var coinEl = $('coin'), tossEl = $('toss'), shadowEl = $('shadow'), btn = $('flip');
  var mode = 'coin', cur = 'rub', angle = 0, busy = false, heads = 0, tails = 0, hist = [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    $('front').innerHTML = face(COINS[cur], 'heads');
    $('back').innerHTML = face(COINS[cur], 'tails');
  }

  var LABELS = {
    coin: { h: 'Орёл', t: 'Решка', hs: 'О', ts: 'Р', idle: 'Подбрось монету' },
    yesno: { h: 'Да', t: 'Нет', hs: 'Д', ts: 'Н', idle: 'Подбрось монету' }
  };

  function setMode(m) {
    if (busy || m === mode) return;
    mode = m;
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false');
    });
    heads = 0; tails = 0; hist = [];
    $('cntH').textContent = 0; $('cntT').textContent = 0; $('history').innerHTML = '';
    $('lblH').textContent = LABELS[m].h; $('lblT').textContent = LABELS[m].t;
    $('resultBig').textContent = LABELS[m].idle;
    $('resultSmall').textContent = 'Нажми кнопку или саму монету';
    draw();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  }

  function setCurrency(c) {
    if (busy) return;
    cur = c;
    document.querySelectorAll('.currencies button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.cur === c ? 'true' : 'false');
    });
    draw();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  }

  function randomBit() {
    var a = new Uint8Array(1);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return a[0] & 1;
  }

  function flip() {
    if (busy) return;
    busy = true; btn.disabled = true;
    $('resultBig').textContent = '…';
    $('resultSmall').textContent = 'Летит ' + COINS[cur].name;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

    var isHeads = randomBit() === 0;
    var start = angle;
    var base = Math.ceil(start / 360) * 360 + 360 * (5 + Math.floor(Math.random() * 3));
    angle = base + (isHeads ? 0 : 180);
    var dur = reduce ? 1 : 1500;

    coinEl.animate([
      { transform: 'rotateY(' + start + 'deg) rotateX(0deg)' },
      { transform: 'rotateY(' + (start + (angle - start) * .5) + 'deg) rotateX(14deg)', offset: .5 },
      { transform: 'rotateY(' + angle + 'deg) rotateX(0deg)' }
    ], { duration: dur, easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'forwards' });
    tossEl.animate([
      { transform: 'translateY(0) scale(1)' },
      { transform: 'translateY(-38%) scale(1.12)', offset: .45 },
      { transform: 'translateY(0) scale(1)', offset: .85 },
      { transform: 'translateY(-4%) scale(1)', offset: .92 },
      { transform: 'translateY(0) scale(1)' }
    ], { duration: dur, easing: 'ease-in-out' });
    shadowEl.animate([
      { opacity: 1, transform: 'translateX(-50%) scale(1)' },
      { opacity: .35, transform: 'translateX(-50%) scale(.6)', offset: .45 },
      { opacity: 1, transform: 'translateX(-50%) scale(1)', offset: .85 },
      { opacity: 1, transform: 'translateX(-50%) scale(1)' }
    ], { duration: dur, easing: 'ease-in-out' });

    setTimeout(function () {
      if (isHeads) heads++; else tails++;
      report();
      maybeShowAdsgram(heads + tails);
      var L = LABELS[mode];
      hist.unshift(isHeads ? L.hs : L.ts);
      if (hist.length > 10) hist.pop();
      $('resultBig').textContent = isHeads ? L.h : L.t;
      var q = $('question').value.trim();
      $('resultSmall').textContent = q
        ? '«' + q + '»'
        : 'Монета: ' + COINS[cur].name + ' · бросок №' + (heads + tails);
      $('cntH').textContent = heads; $('cntT').textContent = tails;
      $('history').innerHTML = hist.map(function (h) {
        return '<span class="' + (h === L.hs ? 'h' : '') + '">' + h + '</span>';
      }).join('');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      busy = false; btn.disabled = false;
    }, dur);
  }

  document.querySelectorAll('.currencies button').forEach(function (b) {
    b.addEventListener('click', function () { setCurrency(b.dataset.cur); });
  });
  document.querySelectorAll('.modes button').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });
  $('question').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.target.blur(); flip(); } });
  btn.addEventListener('click', flip);
  coinEl.addEventListener('click', flip);
  draw();
})();
</script>
</body>
</html>
